name: Manter Supabase ativo

# Consulta o banco todo dia para o plano grátis do Supabase não pausar o projeto
# (o mesmo projeto do estoque e do portfólio).
on:
  schedule:
    - cron: "17 11 * * *"   # todo dia às 08:17 (horário de Brasília)
  workflow_dispatch:         # botão "Run workflow" para testar na hora

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: https://qenkaiybtjrpmzsmxukg.supabase.co
          # chave pública (anon), a mesma que já está no index.html
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlbmthaXlidGpycG16c214dWtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NDQ0NTQsImV4cCI6MjExMDAyMDQ1NH0.JlaSDItSanR-1fSuwUT2tB-BnZ6fEx3C1VyLebdZhwI
        run: |
          for tentativa in 1 2 3; do
            status=$(curl -s -o resposta.txt -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/portfolio_produtos?select=code&limit=1" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY")
            echo "Tentativa $tentativa: HTTP $status"
            cat resposta.txt; echo
            if [ "$status" = "200" ]; then
              echo "Banco ativo."
              exit 0
            fi
            sleep 30
          done
          echo "O banco não respondeu. Pode ter sido pausado: entre no Supabase e clique em Restore project."
          exit 1
